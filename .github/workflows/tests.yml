name: UI_tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: run Playwright tests with pytest and generate Allure result
        run: |
          pytest -m regression --alluredir=./allure-results --numprocesses=4

      - name: Restore cached Coverage History
        if: always()
        uses: actions/cache/restore@v6
        with:
          path: |
            path: coverage-gistory.json
          key: coverage-history-${{ github.run_id }}
          restore-keys: |
            coverage-history-

      - name: Generate Coverage report
        run: |
          ui-coverage-tool save-report

      - name: Save cached Coverage History
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            coverage-history.json
          key: coverage-history-${{ github.run_id }}

      - name: Upload Coverage Results Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: coverage.html

      - name: Upload Artifacts for Deploy results to GitHub Pages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results

  publish-report:
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()

    steps:
      - name: Download Artifacts from jobs "run-tests"
        uses: actions/download-artifact@v5
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          fetch-depth: 0
          ref: gh-pages
          path: gh-pages

      - name: Allure Report action from marketplace
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure-results: allure-results
          allure-history: allure-history

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history